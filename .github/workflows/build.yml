Name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p SwipeBlur && cd SwipeBlur
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SwipeBlur"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx1536m
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.lotus.swipeblur"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.lotus.swipeblur"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BlurService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">Swipe Blur</string>
              <string name="service_desc">Плавное размытие экрана при прокрутке в любых приложениях.</string>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_desc"
              android:notificationTimeout="30" />
          EOF_FILE
          mkdir -p app/src/main/java/com/lotus/swipeblur
          cat > app/src/main/java/com/lotus/swipeblur/BlurService.kt <<'EOF_FILE'
          package com.lotus.swipeblur

          import android.accessibilityservice.AccessibilityService
          import android.animation.Animator
          import android.animation.AnimatorListenerAdapter
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent

          class BlurService : AccessibilityService() {
              private lateinit var wm: WindowManager
              private var overlay: View? = null
              private var lp: WindowManager.LayoutParams? = null
              private var anim: ValueAnimator? = null
              private var radius = 0
              private var target = 0
              private val h = Handler(Looper.getMainLooper())
              private val fade = Runnable { animateTo(0, 380) }

              override fun onServiceConnected() {
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e?.eventType != AccessibilityEvent.TYPE_VIEW_SCROLLED) return
                  val max = getSharedPreferences("p", 0).getInt("strength", 25)
                  if (overlay == null) add()
                  h.removeCallbacks(fade)
                  if (target != max) animateTo(max, 100)
                  h.postDelayed(fade, 170)
              }

              private fun add() {
                  val v = View(this)
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_BLUR_BEHIND,
                      PixelFormat.TRANSLUCENT
                  )
                  p.blurBehindRadius = 0
                  radius = 0; target = 0
                  wm.addView(v, p)
                  overlay = v; lp = p
              }

              private fun animateTo(to: Int, ms: Long) {
                  val v = overlay ?: return
                  val p = lp ?: return
                  anim?.cancel()
                  target = to
                  anim = ValueAnimator.ofInt(radius, to).apply {
                      duration = ms
                      addUpdateListener {
                          radius = it.animatedValue as Int
                          p.blurBehindRadius = radius
                          // запасной вариант, если блюр не поддерживается: лёгкое затемнение
                          v.setBackgroundColor((minOf(radius, 80) * 1) shl 24)
                          if (overlay != null) wm.updateViewLayout(v, p)
                      }
                      addListener(object : AnimatorListenerAdapter() {
                          override fun onAnimationEnd(a: Animator) {
                              if (target == 0 && radius == 0) remove()
                          }
                      })
                      start()
                  }
              }

              private fun remove() {
                  h.removeCallbacks(fade)
                  overlay?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  overlay = null; lp = null; radius = 0; target = 0
              }

              override fun onInterrupt() { remove() }
              override fun onDestroy() { anim?.cancel(); remove(); super.onDestroy() }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/lotus/swipeblur
          cat > app/src/main/java/com/lotus/swipeblur/MainActivity.kt <<'EOF_FILE'
          package com.lotus.swipeblur

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var status: TextView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val prefs = getSharedPreferences("p", 0)
                  val d = resources.displayMetrics.density
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#10131A"))
                      setPadding((28 * d).toInt(), 0, (28 * d).toInt(), 0)
                  }
                  fun tv(t: String, sp: Float, a: Float = 1f) = TextView(this).apply {
                      text = t; textSize = sp; alpha = a; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                  }
                  root.addView(tv("Swipe Blur", 34f))
                  status = tv("", 16f, .8f)
                  root.addView(status)
                  root.addView(tv("\nСила размытия", 15f, .7f))
                  root.addView(SeekBar(this).apply {
                      max = 75; progress = prefs.getInt("strength", 25) - 5
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, v: Int, u: Boolean) {
                              prefs.edit().putInt("strength", v + 5).apply()
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  })
                  root.addView(Button(this).apply {
                      text = "Start"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  })
                  root.addView(tv("В настройках найди «Swipe Blur» и включи.\nВыключить так же там.", 14f, .6f))
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  val on = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                      ?.contains(packageName) == true
                  status.text = if (on) "Работает ✓" else "Выключено"
              }
          }
          EOF_FILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Build
        working-directory: SwipeBlur
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeBlur-APK
          path: SwipeBlur/app/build/outputs/apk/debug/app-debug.apk
